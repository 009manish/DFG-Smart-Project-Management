<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DFG - Join Session</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 10% 20%, #102d72 0%, transparent 30%),
                radial-gradient(circle at 90% 20%, #35136b 0%, transparent 32%),
                linear-gradient(135deg, #020817, #080b2b, #10052b);
        }

        .card {
            width: 450px;
            padding: 45px;

            background: rgba(7, 13, 39, 0.92);

            border: 1px solid rgba(120, 135, 255, 0.2);

            border-radius: 22px;

            text-align: center;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 40px;
            font-weight: 800;

            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #168cff,
                #8b45ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8e9abb;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;

            margin-top: 16px;
            margin-bottom: 8px;

            text-align: left;

            color: #cbd4f2;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 15px;

            border-radius: 11px;

            border: 1px solid #293456;

            background: #03091c;

            color: white;

            text-align: center;

            font-size: 16px;

            outline: none;
        }

        #session_code {
            letter-spacing: 3px;
        }

        input:focus {
            border-color: #596cff;
        }

        input::placeholder {
            color: #586582;
        }

        button {
            width: 100%;
            height: 55px;

            margin-top: 25px;

            border: none;
            border-radius: 11px;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #168cff,
                #783cff
            );

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(80, 80, 255, 0.25);
        }

        .hint {
            margin-top: 18px;

            color: #596783;

            font-size: 12px;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="logo">
            DFG
        </div>

        <h1>
            Join Session
        </h1>

        <div class="subtitle">
            Enter the session details shared by your team leader.
        </div>


        <form action="/join-session" method="POST">


            <!-- SESSION CODE -->

            <label for="session_code">
                Session Code
            </label>

            <input
                type="text"
                id="session_code"
                name="session_code"
                placeholder="DFG-0007"
                required
                autocomplete="off"
            >


            <!-- NAME -->

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
                autocomplete="name"
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >


            <button type="submit">
                Join Session →
            </button>

        </form>


        <div class="hint">
            Example: DFG-0007
        </div>

    </div>

</body>

</html>
